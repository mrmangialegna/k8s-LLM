apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: open-webui
spec:
  podSelector:
    matchLabels:
      app: open-webui
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: 
          kubernetes.io/metadata.name: kube-system
          
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik

    ports:
    - protocol: TCP
      port: 8080