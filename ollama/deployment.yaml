apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: llm-worker
      containers:

        tolerations:
        - key: "noschedule"
          operator: "Exists"
          effect: "NoSchedule"

        - startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 0
            failureThreshold: 3
            periodSeconds: 30
        
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 0
            failureThreshold: 3
            periodSeconds: 10

          name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434        
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          env:
            - name: OLLAMA_MODELS
              value: /usr/share/ollama/.ollama/models  
            - name: OLLAMA_KEEP_ALIVE
              valueFrom:
                configmapKeyRef:
                  name: cmap_ollama
                  key: OLLAMA_KEEP_ALIVE
            - name: OLLAMA_NUM_PARALLEL
              valueFrom:
                configmapKeyRef:
                  name: cmap_ollama
                  key: OLLAMA_NUM_PARALLEL
            - name: OLLAMA_MAX_LOADED_MODELS
              valueFrom:
                configmapKeyRef:
                  name: cmap_ollama
                  key: OLLAMA_MAX_LOADED_MODELS
              
          resources:  
            requests:
              cpu: 2
              memory: 2Gi
            limits:
              cpu: 4
              memory: 6Gi
          volumeMounts:
            - name: ollama-pvc
              mountPath: /usr/share/ollama/.ollama
            - name: ollama-data
              mountPath: /root/.ollama               
      volumes:
        - name: ollama-pvc
          persistentVolumeClaim:
            claimName: ollama-pvc
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data-pvc