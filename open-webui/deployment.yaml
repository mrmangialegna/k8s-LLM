apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            failureThreshold: 3
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: OLLAMA_BASE_URL
            - name: WEBUI_AUTH
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: WEBUI_AUTH
            - name: DEFAULT_USER_ROLE
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: DEFAULT_USER_ROLE
            - name: ENABLE_SIGNUP
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: ENABLE_SIGNUP
            - name: WEBUI_NAME
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: WEBUI_NAME
            - name: GLOBAL_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: GLOBAL_LOG_LEVEL
            - name: ENABLE_PERSISTENT_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: open-webui-config
                  key: ENABLE_PERSISTENT_CONFIG
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-pvc
