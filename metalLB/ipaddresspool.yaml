apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: llm-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.40-192.168.0.90
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: llm-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - llm-pool
